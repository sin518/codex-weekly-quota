name: Publish desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-macos:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: desktop-app
        run: npm ci

      - name: Build macOS aarch64
        working-directory: desktop-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Build macOS x86_64
        working-directory: desktop-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-apple-darwin

      - name: Delete existing release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set +e
          gh release delete "$VERSION" --yes --cleanup-tag >/dev/null 2>&1
          exit 0

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            --title "Codex Weekly Quota $VERSION" \
            --notes "Download the installer for macOS. The in-app updater uses the signed latest.json manifest from this release."

      - name: Upload macOS artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          for dir in \
            desktop-app/src-tauri/target/aarch64-apple-darwin/release/bundle \
            desktop-app/src-tauri/target/x86_64-apple-darwin/release/bundle
          do
            find "$dir" -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.sig" -o -name "*.xml" \) -print0 |
              while IFS= read -r -d '' file; do
                echo "Uploading: $file"
                gh release upload "$VERSION" "$file" --clobber
              done
          done
